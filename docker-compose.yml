# Segunda vía de ejecución, sin instalar Node:
#   docker compose up --build   →   http://localhost:8080
# La vía principal sigue siendo la del README (npm install en cada carpeta).

services:
  app:
    build: .
    ports:
      - "8080:3000"
    env_file:
      # Opcional: IA real (AI_PROVIDER y su clave). Sin él, modo simulado.
      - path: ./backend/.env
        required: false
    environment:
      # Fijas dentro del contenedor; tienen prioridad sobre el .env.
      PORT: "3000"
      DATABASE_PATH: /app/data/agents.db
    volumes:
      # La base de datos sobrevive a reiniciar o reconstruir el contenedor.
      - agents-data:/app/data
    restart: unless-stopped

volumes:
  agents-data:
