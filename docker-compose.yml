# Segunda vía de ejecución, sin instalar Node:
#   docker compose up --build   →   http://localhost:8080
# La vía principal sigue siendo la del README (npm install en cada carpeta).

services:
  # La API. No se publica fuera: solo la alcanza el frontend por el nombre «backend».
  backend:
    build: ./backend
    env_file:
      # Opcional: IA real (AI_PROVIDER y su clave). Sin él, modo simulado.
      - path: ./backend/.env
        required: false
    environment:
      # Fijas dentro del contenedor; tienen prioridad sobre el .env.
      PORT: "3000"
      DATABASE_PATH: /app/data/agents.db
    volumes:
      # La base de datos sobrevive a reiniciar o reconstruir el contenedor.
      - agents-data:/app/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/ai/status"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  # La página (nginx). Es lo único que se publica: puerto 8080 del equipo.
  frontend:
    build: ./frontend
    ports:
      - "8080:8080"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      # 127.0.0.1 y no localhost: dentro del contenedor localhost apunta a IPv6 y nginx escucha en IPv4.
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

volumes:
  agents-data:
