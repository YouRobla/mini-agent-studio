server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # La API va al backend por la red de Docker. Para el navegador es el mismo
  # origen que la página, así que no hay CORS.
  location /api/ {
    proxy_pass http://backend:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    # Un proveedor de IA real puede tardar varios segundos en responder.
    proxy_read_timeout 120s;
  }

  # Rutas de React Router (/consultar/...): si no es un archivo, index.html.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
