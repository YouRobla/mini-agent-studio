# nginx hace dos cosas: sirve el frontend compilado y reenvía /api al backend.
# Así la página y la API comparten origen (sin CORS), igual que con el proxy de Vite.
server {
  listen 8080;
  root /usr/share/nginx/html;

  # /api/... va al contenedor del backend, que se encuentra por su nombre de servicio.
  location /api/ {
    proxy_pass http://backend:3000;
    # La IP real del cliente, para que el límite de peticiones cuente a cada uno.
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    # Una respuesta de un proveedor de IA real puede tardar varios segundos.
    proxy_read_timeout 120s;
  }

  # El resto son archivos del frontend. Si no existe (por ejemplo /consultar/123),
  # se devuelve index.html y React Router pinta la página.
  location / {
    try_files $uri /index.html;
  }
}
